version: 2

updates:
  # The workspace. Grouped so a routine week is one reviewable pull request
  # rather than twenty, and so the five-command gate runs once over the set
  # instead of once per bump.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-patches:
        dependency-type: production
        update-types:
          - patch

  # Actions are pinned to commit SHAs and checked by test/release/workflows.spec.ts.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
