name: ci-linux

# S1 gate (§1.8): the full unit path runs on Linux with zero live dependencies (§4.0).
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # s8 Sc4 (F-99), corrected in s9. electron@44.2.0 has NO postinstall: the
    # binary is fetched by `@electron/get` the first time `require('electron')`
    # runs. That fetch honours `electron_config_cache` and nothing else, so for
    # four months the cache step below saved an empty directory and every run
    # re-downloaded the shell ("Cache not found for input keys" on every log).
    # `ELECTRON_CACHE` stays because an arch row names it and because the
    # tooling around electron-builder still reads it; the lowercase key is the
    # one the download actually consults.
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `test/release/s9-e2e.spec.ts` diffs the tree against the S8-close
          # commit `a292dc5`, and `actions/checkout` defaults to a depth-1
          # shallow clone in which that revision does not exist. The rows do
          # not degrade quietly when it is missing, they fail with `fatal: bad
          # revision`, which is the right behaviour and is how this was found.
          # The history is what the assertion needs, so the history is what CI
          # gets: fetching it is narrowing the environment, whereas teaching
          # the rows to skip on a shallow clone would be widening the guard.
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # Keyed on the EXACT pinned version, not on the lockfile hash: the
      # payload is one binary for one version, and a lockfile key would evict
      # a perfectly good download every time an unrelated dependency moved.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-44.2.0
      - run: pnpm install --frozen-lockfile
      # Fetch the Electron binary ONCE, before any vitest worker exists.
      # Left to the first `require('electron')`, that download happens inside
      # two or three desktop workers at the same time, and the second
      # extractor writes over the file the first is exec'ing: ETXTBSY, and a
      # whole e2e file goes red for a reason that has nothing to do with it.
      # This is provisioning, not serialisation: the suite still runs with the
      # parallelism the runner has. Idempotent, so it exits in about a second
      # once the cache above is warm.
      - run: pnpm --filter @wemessage/desktop exec install-electron
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm dep:check
      - run: pnpm licenses:check
      # The desktop e2e launches a real Chromium. `ubuntu-latest` has no
      # display, and an Electron app on a headless Linux box does not fail
      # loudly, it hangs until the suite times out. `xvfb-run -a` gives it one.
      # This is the ONE step that runs the suite, so nothing is excluded from
      # it: an excluded file is an untested file.
      - run: xvfb-run -a pnpm test
