name: ci-linux

# S1 gate (§1.8): the full unit path runs on Linux with zero live dependencies (§4.0).
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `test/release/s9-e2e.spec.ts` diffs the tree against the S8-close
          # commit `a292dc5`, and `actions/checkout` defaults to a depth-1
          # shallow clone in which that revision does not exist. The rows do
          # not degrade quietly when it is missing, they fail with `fatal: bad
          # revision`, which is the right behaviour and is how this was found.
          # The history is what the assertion needs, so the history is what CI
          # gets: fetching it is narrowing the environment, whereas teaching
          # the rows to skip on a shallow clone would be widening the guard.
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm dep:check
      - run: pnpm licenses:check
      # This is the ONE step that runs the suite, so nothing is excluded from
      # it: an excluded file is an untested file.
      - run: pnpm test
