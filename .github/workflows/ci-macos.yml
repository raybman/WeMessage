name: ci-macos

# v2 S6b. The macOS node gate. Until S6b this lane ran the Electron app's
# whole suite on a real window server and packed an ad-hoc Electron bundle
# beside it. The app that ships is now the Swift one (`apps/mac`), and it has
# its own lane, `ci-swift.yml`, which builds, tests and snapshots it on the
# same macOS release it targets. What stays here is everything in this repo
# that runs on Node and has a reason to run on macOS: the daemon and its real
# `launchctl` lifecycle project, the CLI, the adapters, the release tooling,
# and the repo-level guards in `test/`.
#
# It runs the Linux gate step for step, minus the two Electron provisioning
# steps, with the suite narrowed to the node projects (`pnpm test:node`, an
# explicit project list that `test/arch.spec.ts` holds equal to every vitest
# project minus the Electron ones). Linux still runs the Electron projects
# until S6c deletes them; nothing here is untested on both lanes at once.
#
# What this lane deliberately does NOT do: ask for a secret, or sign, or
# notarize. The release build is self-signed and not notarized, and only
# `release.yml` holds the material to sign it. A step here that pretended to
# sign would either need a secret a pull request must never see or would be
# a green tick attached to nothing.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    # The floor the app ships for (macOS 26 Tahoe, D-01), the same runner
    # image the Swift lane uses.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `test/release/s9-e2e.spec.ts` diffs the tree against the S8-close
          # commit `a292dc5`, and `actions/checkout` defaults to a depth-1
          # shallow clone in which that revision does not exist. The rows do
          # not degrade quietly when it is missing, they fail with `fatal: bad
          # revision`, which is the right behaviour and is how this was found.
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm dep:check
      - run: pnpm licenses:check
      # The ONE step that runs the suite. The project list is closed and an
      # arch row holds it, so a new package cannot be missing from it.
      - run: pnpm test:node
