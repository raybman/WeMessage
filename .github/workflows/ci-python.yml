name: ci-python

# s7 Sc7 (F-88): the Python lane, and its own workflow rather than a step in
# ci-linux.
#
# Two reasons, both about signal. A Python interpreter, a wheel download and a
# hash check are a different failure surface from a pnpm build, and mixing
# them means a flaky wheel mirror reads as "TypeScript is broken" on the
# checks list. And this job is the ONLY place the Python conformance rows
# actually execute: the vitest rows skip when no interpreter in the supported
# range is available, so on a contributor's machine they may be green without
# having run. `WEMESSAGE_PYTHON` below flips that — naming an interpreter is a
# PROMISE, and under a promise a skip is a failure, because a green tick that
# verified nothing is worse than a red one.
#
# It is deliberately not `CI: 'true'`. GitHub sets `CI` on every runner, so it
# identifies no lane: read as a marker it made the TypeScript lanes, which are
# forbidden an interpreter by row 9, assert that they have one.
#
# Blocking, not advisory. Nothing here is marked as tolerating failure, on
# purpose: a lane allowed to go red quietly is a lane nobody reads. If this
# job ever has to stop blocking, that is a commit that cites the flake and
# opens a flag, not a one-word key nobody notices. The conformance spec
# asserts the absence, so this comment cannot describe the file's opposite.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  python-conformance:
    runs-on: ubuntu-latest
    # The promise, job-level so the pip step and both vitest steps below mean
    # the same binary. Row 9 asserts this line, with exactly this value: drop
    # it and the strict branch in both interpreted specs switches off, on the
    # one lane whose entire purpose is that it must not skip.
    env:
      WEMESSAGE_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # Pinned to 3.12, inside the >=3.11,<3.14 range plugin/pyproject.toml
      # declares and Hermes itself pins. Not "3.x": the interpreter the rows
      # below run on has to be the one they claim to have run on.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # --require-hashes turns the pins in requirements.txt into a refusal.
      # Without it a compromised index could serve a different artifact under
      # the same version and pip would install it without comment. It also
      # makes the file's one-line rule enforceable: every requirement must
      # carry a hash or the whole install fails.
      - run: python -m pip install --require-hashes -r packages/adapters/hermes/plugin/requirements.txt
      - run: python -c "import websockets, sys; print(sys.version); print(websockets.version.version)"
      - run: pnpm install --frozen-lockfile
      # The conformance rows import the testkit from dist/, so the build is
      # not optional here even though this job runs no TypeScript of its own.
      - run: pnpm build
      - run: pnpm vitest run --project adapter-hermes
      # A SECOND step, not a second `--project` on the first. A positional
      # filter applies to EVERY listed project, so one command carrying
      # `--project adapter-hermes --project daemon s7-e2e` collects zero
      # adapter-hermes files and goes green having run none of them.
      #
      # This is the only lane on which the daemon's interpreted row executes.
      # It ran nowhere before: this workflow filtered to adapter-hermes, and
      # the TypeScript lanes have no interpreter to run it with.
      - run: pnpm vitest run --project daemon s7-e2e
