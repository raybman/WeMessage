name: release

# Cutting a release of WeMessage, the Swift app in `apps/mac`.
#
# v2 S6b and S6c. Until S6b this file also packed the previous desktop app,
# with a dormant Developer ID and notarize lane beside an ad-hoc one. That
# app no longer ships (S5c pointed the cask at the Swift app) and S6c deleted
# it, so that job, its Apple secrets and its notarize step are gone. What is
# left is two jobs: the gate (`build-test`) and `pack-swift`.
#
# The app is SELF-SIGNED, deliberately, and not notarized. This is an
# open-source macOS app: the point is that anyone can download it, read it,
# build it and change it, and putting a 99 USD annual membership between a
# reader and a working build would be a toll booth in front of the only thing
# the project is for. Self-signed with ONE long-lived identity, so that the
# designated requirement, the string macOS keys every privacy grant on, stays
# the same from one release to the next and an update keeps its grants.
#
# `pack-swift`'s lane is decided by one step (`swiftsign`), and it has two
# modes. `selfsigned` imports the real identity from two secrets and is
# dormant until they exist (S5d). `throwaway`, the mode every run takes
# today, mints an identity that lives for this job only, so the whole
# pipeline (sign, verify, pack twice, compare the designated requirement,
# build the disk image) is exercised on every run with no credential at all.
# A throwaway build never reaches a release: its one upload is the disk
# image, as a workflow artifact named `-throwaway`, so a dry run can be
# looked at. Every step that needs a secret carries an explicit `if:` on a
# decider's output, never an empty secret left to fail harmlessly:
# `test/release/workflows.spec.ts` row 4 walks every step and refuses that.
#
# The disk image (`dmg-swift`, signed with the same leaf) and `dr-diff` came
# in S5b: in the selfsigned lane, after the second pack and before any
# upload, the designated requirement is compared with the previous published
# release's, and a change CHANGELOG.md does not justify fails the job with
# nothing published.
#
# The Homebrew cask is the second decider (`tap`): a pull request to the tap
# is opened only for a selfsigned build, only when the tap token exists, and
# never on a dry run.
#
# Every third-party action is pinned to a 40-hex commit SHA with its human
# version in a trailing comment. A tag is mutable, and this job holds
# `contents: write`.
#
# A DISPATCH CHECKS OUT THE TAG IT NAMES. Every checkout below reads
# `inputs.tag || github.ref`: on a tag push the input is empty and the ref is
# the tag; on a dispatch the input is the tag (or branch) to build, so a
# dispatch can never pack the branch head and name it after a tag.
#
# `dry_run` is for proving the lane without a release: it skips every step
# that uploads to a release or opens a pull request, and nothing else.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

# The whole grant. Attaching a DMG to a release needs `contents: write` and
# nothing else. No `id-token` (no cloud identity to mint), no `packages` (this
# publishes nothing to a registry).
permissions:
  contents: write

jobs:
  # The same gate the branch CI runs, run again on the tagged tree. A tag is
  # cut from a commit, not from a pull request, so it is entirely possible for
  # the tagged tree to be one nobody ever ran the suite on.
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `test/release/s9-e2e.spec.ts` diffs the tree against the S8-close
          # commit `a292dc5`, and `actions/checkout` defaults to a depth-1
          # shallow clone in which that revision does not exist. The rows do
          # not degrade quietly when it is missing, they fail with `fatal: bad
          # revision`, which is the right behaviour and is how this was found.
          # The history is what the assertion needs, so the history is what CI
          # gets: fetching it is narrowing the environment, whereas teaching
          # the rows to skip on a shallow clone would be widening the guard.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm dep:check
      - run: pnpm licenses:check
      - run: pnpm test

  # v2 S5a. The Swift app, packed and self-signed. It needs the gate and
  # nothing else.
  pack-swift:
    needs: [build-test]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: swift --version

      # THE ONE STEP THAT DECIDES THE SIGNING LANE.
      #
      # It reads the secret in `run:`, never in `if:`. GitHub's context
      # availability table does not list `secrets` among the contexts readable
      # from a step-level `if:`, so a condition written `if: secrets.X != ''`
      # is at best undefined and at worst silently false, which would disable
      # the step it was meant to enable. Converting the secret to an output
      # here means every later `if:` reads `steps.*`, which is documented, and
      # the decision is made exactly once, visible in the log as one line.
      - id: swiftsign
        name: decide-swift-signing-mode
        env:
          WEMESSAGE_SIGN_P12: ${{ secrets.WEMESSAGE_SIGN_P12 }}
        run: |
          if [ -n "$WEMESSAGE_SIGN_P12" ]; then
            printf 'mode=selfsigned\n' >> "$GITHUB_OUTPUT"
          else
            printf 'mode=throwaway\n' >> "$GITHUB_OUTPUT"
          fi

      # The other decider, in the same shape: whether a cask pull request can
      # be opened at all. Read once here; `publish-cask` reads the output.
      - id: tap
        name: decide-tap-lane
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [ -n "$TAP_PUSH_TOKEN" ]; then
            printf 'tap=yes\n' >> "$GITHUB_OUTPUT"
          else
            printf 'tap=no\n' >> "$GITHUB_OUTPUT"
          fi

      # The real identity, from the two secrets S5d sets. Dormant until then.
      - id: import-release-signing-identity
        name: import-release-signing-identity
        if: steps.swiftsign.outputs.mode == 'selfsigned'
        env:
          WEMESSAGE_SIGN_P12: ${{ secrets.WEMESSAGE_SIGN_P12 }}
          WEMESSAGE_SIGN_P12_PASSWORD: ${{ secrets.WEMESSAGE_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/wemessage-sign.keychain-db"
          kcpw="$(openssl rand -hex 24)"
          # Key material under RUNNER_TEMP only, never in the workspace.
          printf '%s' "$WEMESSAGE_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 1800 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/identity.p12" -k "$kc" -P "$WEMESSAGE_SIGN_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          # The certificate is read back out of the keychain, not out of the
          # p12, so the p12's encryption suite never matters to openssl.
          security find-certificate -a -p "$kc" > "$RUNNER_TEMP/cert.pem"
          # A self-signed leaf is refused by codesign until it is trusted for
          # code signing. The admin domain only, through the passwordless sudo
          # hosted runners have: a user-domain trust change asks for
          # authorization in a dialog. Trust is only ever ADDED: a removal
          # waits on a dialog even under sudo.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem" || {
            echo "the signing certificate could not be trusted for code signing" >&2
            exit 1
          }
          leaf="$(openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -fingerprint -sha1 |
            awk -F= '{gsub(":", "", $2); print tolower($2)}')"
          security find-identity -v -p codesigning "$kc" |
            awk -v want="$leaf" 'tolower($2) == want {found = 1} END {exit !found}' || {
            echo "the imported identity is not a valid code-signing identity" >&2
            exit 1
          }
          printf 'leaf=%s\n' "$leaf" >> "$GITHUB_OUTPUT"

      # The identity every run without the secrets uses: minted here, for
      # this job, and deleted by the cleanup step. It names no secret, which
      # is what lets a fork or a dry run exercise the whole lane.
      - id: mint-throwaway-signing-identity
        name: mint-throwaway-signing-identity
        if: steps.swiftsign.outputs.mode == 'throwaway'
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/wemessage-sign.keychain-db"
          kcpw="$(/usr/bin/openssl rand -hex 24)"
          p12pw="$(/usr/bin/openssl rand -hex 24)"
          cat > "$RUNNER_TEMP/mint.cnf" <<'EOF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = WeMessage Throwaway
          [ext]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          EOF
          # /usr/bin/openssl (LibreSSL) on purpose: its default p12 suite is
          # one `security import` reads, which OpenSSL 3's default is not.
          /usr/bin/openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
            -config "$RUNNER_TEMP/mint.cnf" \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
            -out "$RUNNER_TEMP/identity.p12" -passout "pass:$p12pw"
          rm -f "$RUNNER_TEMP/key.pem"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 1800 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/identity.p12" -k "$kc" -P "$p12pw" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          # A self-signed leaf is refused by codesign until it is trusted for
          # code signing. The admin domain only, through the passwordless sudo
          # hosted runners have: a user-domain trust change asks for
          # authorization in a dialog. Trust is only ever ADDED: a removal
          # waits on a dialog even under sudo.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem" || {
            echo "the signing certificate could not be trusted for code signing" >&2
            exit 1
          }
          leaf="$(/usr/bin/openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -fingerprint -sha1 |
            awk -F= '{gsub(":", "", $2); print tolower($2)}')"
          security find-identity -v -p codesigning "$kc" |
            awk -v want="$leaf" 'tolower($2) == want {found = 1} END {exit !found}' || {
            echo "the imported identity is not a valid code-signing identity" >&2
            exit 1
          }
          printf 'leaf=%s\n' "$leaf" >> "$GITHUB_OUTPUT"

      # THE PROOF THE SIGNATURE IS STABLE. Two packs from one build, and the
      # designated requirement (the string macOS keys every privacy grant
      # on) must come out byte-identical. A throwaway build is named so.
      - id: pack-swift-twice
        name: pack-swift-twice
        env:
          LEAF: ${{ steps.import-release-signing-identity.outputs.leaf || steps.mint-throwaway-signing-identity.outputs.leaf }}
          MODE: ${{ steps.swiftsign.outputs.mode }}
        run: |
          set -euo pipefail
          extra=""
          if [ "$MODE" = "throwaway" ]; then extra="--throwaway"; fi
          pnpm pack:swift --identity "$LEAF" --out apps/mac/dist-pack ${extra:+"$extra"}
          pnpm pack:swift --identity "$LEAF" --out apps/mac/dist-pack-2 --skip-build ${extra:+"$extra"}
          cmp apps/mac/dist-pack/DESIGNATED_REQUIREMENT.txt apps/mac/dist-pack-2/DESIGNATED_REQUIREMENT.txt
          cat apps/mac/dist-pack/DESIGNATED_REQUIREMENT.txt

      # The bundle verifies, carries one leaf throughout, and records what
      # Gatekeeper makes of it (never fatal). The leaf stays trusted here:
      # removing a trust setting waits on an authorization dialog even
      # under sudo (dispatch 37950305539 hung on it in this step and in
      # cleanup), and nothing here needs it gone. The designated requirement
      # pins `certificate leaf = H"..."`, which codesign checks without
      # consulting trust, and spctl already rejects the app with trust in
      # place. The runner VM, trust setting and all, is discarded after the
      # job.
      - id: verify-swift-bundle
        name: verify-swift-bundle
        # A step limit, so a hang fails this step with its log intact rather
        # than eating the job's 40 minutes.
        timeout-minutes: 10
        env:
          LEAF: ${{ steps.import-release-signing-identity.outputs.leaf || steps.mint-throwaway-signing-identity.outputs.leaf }}
        run: |
          set -euo pipefail
          bash tools/swift/verify-bundle.sh --app apps/mac/dist-app/WeMessage.app --expect-leaf "$LEAF"

      # The disk image: the app exactly as zipped, next to an Applications
      # symlink, in a plain window (D-UI-181), signed with the same leaf and
      # verified (tools/swift/dmg.sh). Named after the zip, so a throwaway
      # image says so too.
      - id: dmg-swift
        name: dmg-swift
        timeout-minutes: 10
        env:
          LEAF: ${{ steps.import-release-signing-identity.outputs.leaf || steps.mint-throwaway-signing-identity.outputs.leaf }}
        run: |
          set -euo pipefail
          zip="$(ls apps/mac/dist-pack/WeMessage-*.zip)"
          src="$RUNNER_TEMP/dmg-src"
          rm -rf "$src"
          ditto -x -k "$zip" "$src"
          dmg="${zip%.zip}.dmg"
          bash tools/swift/dmg.sh --app "$src/WeMessage.app" --out "$dmg" --identity "$LEAF"
          (cd apps/mac/dist-pack && shasum -a 256 "$(basename "$dmg")" >> SHA256SUMS)
          cat apps/mac/dist-pack/SHA256SUMS

      - id: compare-leaf-with-releasing
        name: compare-leaf-with-releasing
        if: steps.swiftsign.outputs.mode == 'selfsigned'
        env:
          LEAF: ${{ steps.import-release-signing-identity.outputs.leaf }}
        run: |
          awk -v leaf="$LEAF" 'tolower($0) ~ /certificate leaf/ && index(tolower($0), tolower(leaf)) {ok = 1} END {exit !ok}' RELEASING.md

      # THE DESIGNATED REQUIREMENT, DIFFED PER TAG. After the second pack and
      # before any upload: the previous published release's requirement must
      # equal this one, or CHANGELOG.md must carry, under this version's
      # heading, `- Signing identity rotated: <old leaf> -> <new leaf>`.
      # Anything else exits 6 and nothing is published. Read-only calls to
      # GitHub (tools/release/bin/dr-diff.mjs); selfsigned only, because a
      # throwaway leaf is new on every run by design.
      - id: dr-diff
        name: dr-diff
        if: steps.swiftsign.outputs.mode == 'selfsigned'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node tools/release/bin/dr-diff.mjs --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --current apps/mac/dist-pack/DESIGNATED_REQUIREMENT.txt --changelog CHANGELOG.md

      # Uploads. A throwaway build never reaches a release: its disk image
      # alone is kept as a workflow artifact named `-throwaway`, so a dry
      # run can be opened and looked at. A dry run uploads nothing to a
      # release.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.swiftsign.outputs.mode == 'throwaway'
        with:
          name: wemessage-swift-dmg-throwaway
          path: apps/mac/dist-pack/*-throwaway.dmg
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.swiftsign.outputs.mode == 'selfsigned'
        with:
          name: wemessage-swift-selfsigned
          path: apps/mac/dist-pack/
          retention-days: 7

      # The release body is this version's CHANGELOG.md section (`--out` is
      # relative to the repo root). Run in every mode, so a dry run proves the
      # section exists before a tag ever needs it. Not a release file: the
      # list below names the shipped files one glob at a time.
      - name: release-notes
        run: pnpm release:notes --out apps/mac/dist-pack/RELEASE_NOTES.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: steps.swiftsign.outputs.mode == 'selfsigned' && inputs.dry_run != true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The tag the tree was checked out at, on a dispatch as on a push.
          tag_name: ${{ inputs.tag || github.ref_name }}
          # A draft, because the last check on a release is a human looking at
          # it. Nothing in this file publishes on its own.
          draft: true
          # Prerelease is a fact about the VERSION: a semver prerelease is a
          # version with a hyphen after the core. `v1.0.0-rc.1` is one,
          # `v1.0.0` is not, and GitHub excludes prereleases from
          # `/releases/latest`, the link the README hands people.
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          body_path: apps/mac/dist-pack/RELEASE_NOTES.md
          files: |
            apps/mac/dist-pack/*.zip
            apps/mac/dist-pack/*.dmg
            apps/mac/dist-pack/SHA256SUMS
            apps/mac/dist-pack/DESIGNATED_REQUIREMENT.txt

      # Gated three ways: a cask that points at a throwaway build would tell
      # Homebrew users the app is installable when its leaf exists nowhere
      # else; no tap token means nothing to open the pull request with; and a
      # dry run publishes nothing.
      - name: publish-cask
        if: steps.swiftsign.outputs.mode == 'selfsigned' && steps.tap.outputs.tap == 'yes' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          pnpm release:cask --dmg "$(ls apps/mac/dist-pack/WeMessage-*-arm64.dmg)"
          # Opens a review, never writes to the tap's default branch. A wrong
          # sha256 pushed straight to main breaks `brew install` for everyone
          # until somebody notices.
          gh pr create --repo raybman/homebrew-wemessage \
            --title "wemessage $TAG" \
            --body "Automated cask update."

      - id: cleanup-swift-signing-identity
        name: cleanup-swift-signing-identity
        # `always()`: a job that dies mid-pack must not leave a private key
        # behind. The keychain holding it is deleted; the admin-domain trust
        # setting is left for the VM's disposal, because removing one waits
        # on an authorization dialog a headless runner cannot answer.
        if: always()
        timeout-minutes: 5
        run: |
          kc="$RUNNER_TEMP/wemessage-sign.keychain-db"
          if [ -f "$kc" ]; then security delete-keychain "$kc" || true; fi
          rm -f "$RUNNER_TEMP/identity.p12" "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/mint.cnf" || true
