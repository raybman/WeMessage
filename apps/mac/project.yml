# XcodeGen spec for the CI UI lane ONLY. Never run xcodegen on a laptop; the
# generated apps/mac/WeMessage.xcodeproj (gitignored) exists in CI only. It
# sits beside this file because XcodeGen writes `packages.WeMessage.path`
# verbatim, relative to the .xcodeproj.
# `swift build` and `swift test` remain the local build. See
# docs/plans/v2-swift-S3.md (private) for why this file exists.
name: WeMessage
options:
  bundleIdPrefix: sh.wemessage
  deploymentTarget:
    macOS: '26.0'
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: '26.6'
packages:
  WeMessage:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: 'YES'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ''
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  # P2-3: the Xcode target is WeMessageMac so it cannot collide with the local
  # package's executable product `WeMessage` in one derived-data tree; the
  # bundle keeps PRODUCT_NAME WeMessage, so Info.plist's CFBundleExecutable holds.
  WeMessageMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/WeMessage
    dependencies:
      - package: WeMessage
        product: WeMessageDaemonHost
      - package: WeMessage
        product: WeMessageApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.wemessage.gateway
        PRODUCT_NAME: WeMessage
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
        ENABLE_HARDENED_RUNTIME: 'NO'
  WeMessageUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/WeMessageUITests
      # The provisional D-UI values (pending Eric's decisions) are compiled
      # into the UI tests too, so the tests read them instead of restating them.
      - path: Sources/WeMessageApp/ProvisionalUI.swift
      - path: Sources/WeMessageApp/ProvisionalUI+Board07.swift
      # The frost probe patches (S4a), so the backdrop and FrostEvidence agree.
      - path: Sources/WeMessageApp/Glass/FrostProbe.swift
    dependencies:
      - target: WeMessageMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.wemessage.gateway.uitests
        TEST_TARGET_NAME: WeMessageMac
        # The runner bundle has no plist of its own; Xcode writes one, else
        # ad hoc signing refuses the target (run 37551542294).
        GENERATE_INFOPLIST_FILE: 'YES'
schemes:
  WeMessage:
    build:
      targets:
        WeMessageMac: all
        WeMessageUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WeMessageUITests
      gatherCoverageData: false
