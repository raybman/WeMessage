<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- WeMessage mark v2: WM monoline ligature in a flat blue bubble. Canonical asset.
       Deliberately distinct from Apple geometry: flat fill (no send-bubble gradient),
       straight triangular tail (no curled flick), 32% corner radius (not capsule),
       never rendered on a squircle app-icon background. -->
  <rect x="6" y="12" width="84" height="60" rx="19" fill="#0A84FF"/>
  <path d="M60 70 L86 84 L78 58 Z" fill="#0A84FF"/>
  <!-- WM ligature: W's final upstroke and M's stem share the junction at (52,27) -->
  <path d="M17 27 L26.5 57 L34 39 L41.5 57 L52 27"
        fill="none" stroke="rgba(255,255,255,.96)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 57 L52 27 L66 45.5 L79 27 L79 57"
        fill="none" stroke="rgba(255,255,255,.96)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
